[project]
name = "paperskim"
version = "0.2.0"
description = "Condense papers (arXiv, DOI, PDF links, uploads) into short, undergrad-readable PDFs"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "python-multipart",
    "pytest",
    "pytest-asyncio",
]

[dependency-groups]
dev = [
    "respx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
